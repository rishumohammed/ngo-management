version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmf_portal_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:fmf_password@db:3306/fmf_db}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-fmf_production_secret_key_change_me}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://portal.freemindfoundation.org.in}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://portal.freemindfoundation.org.in}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Free Mind Foundation}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-brevo}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@freemindfoundation.org.in}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Free Mind Foundation}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: fmf_portal_db
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-fmf_password}
      - MYSQL_DATABASE=${DB_NAME:-fmf_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
